[package]
name = "pirtm_rs"
version = "0.1.0"
edition = "2021"
description = "CCRE / PARM / Phase Mirror — sovereign, local-first cognition core (Rust backend)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Kani is only required to run the formal proof harnesses.
# It is an optional dependency and is never fetched during a normal `cargo build`.
[dependencies.kani]
version = "0.0.1"
optional = true

[features]
# Enables the Kani proof harness module. Requires the Kani toolchain (`cargo kani`).
kani = ["dep:kani"]
