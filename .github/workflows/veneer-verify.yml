name: Veneer Verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # ADR-301 daily production tick: 07:16 UTC, non-mutating.
    - cron: '16 7 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog

      - name: Install
        run: npm ci

      - name: Verify production gate
        run: npm run verify
