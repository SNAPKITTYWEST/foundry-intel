name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/pages/**'
      - 'docs/brand/**'
      - 'tools/ascii-glitch/**'
      - 'tools/foundry-connector/connector-manifest.json'
      - 'tools/q5-adr-parser/adr_manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build backend ASCII Pages
        run: npm run pages:build

      - name: Check generated Pages
        run: npm run pages:check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
