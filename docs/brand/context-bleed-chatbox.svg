<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-label="Context Bleed Chatbox — hy3 autonomous agent communication surface">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="100%" stop-color="#0c1219"/>
    </linearGradient>
    <!-- Bleed gradient — context bleeding between agents -->
    <linearGradient id="bleedA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bleedB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Scanline pattern -->
    <pattern id="scan" x="0" y="0" width="1" height="9" patternUnits="userSpaceOnUse">
      <rect width="480" height="1" y="8" fill="white" fill-opacity="0.025"/>
    </pattern>
    <!-- Bleed arrow marker -->
    <marker id="arrow-violet" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#a78bfa" opacity="0.7"/>
    </marker>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#60a5fa" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#bg)"/>
  <rect width="480" height="320" fill="url(#scan)"/>

  <!-- Context bleed zone — the shared middle space -->
  <rect x="180" y="0" width="120" height="320" fill="url(#bleedA)" opacity="0.5"/>
  <rect x="180" y="0" width="120" height="320" fill="url(#bleedB)" opacity="0.5"/>
  <!-- Bleed center pulse -->
  <ellipse cx="240" cy="160" rx="40" ry="120" fill="none" stroke="#4dd8c8" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="240" cy="160" rx="20" ry="80" fill="none" stroke="#4dd8c8" stroke-width="0.5" opacity="0.1"/>

  <!-- ── LEFT AGENT: hy3 (Claude / violet) ────────────────────────────── -->
  <!-- Agent panel -->
  <rect x="8" y="8" width="198" height="304" rx="8" fill="#10161d" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Agent header -->
  <rect x="8" y="8" width="198" height="36" rx="8" fill="#141b24"/>
  <rect x="8" y="36" width="198" height="8" fill="#141b24"/>
  <!-- Agent dot -->
  <circle cx="26" cy="26" r="5" fill="#a78bfa" filter="url(#glow-violet)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="38" y="22" font-family="ui-monospace,monospace" font-size="8.5" fill="#f4f1de" font-weight="700">hy3</text>
  <text x="38" y="32" font-family="ui-monospace,monospace" font-size="7" fill="#9fb3c8">Claude Sonnet 4.6 · Anthropic</text>

  <!-- Message bubbles — left agent -->
  <!-- Bubble 1 -->
  <rect x="20" y="54" width="148" height="36" rx="6" fill="#1a1f2e" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="30" y="67" font-family="ui-monospace,monospace" font-size="7.5" fill="#c4b5fd">Committing d7f9455.</text>
  <text x="30" y="79" font-family="ui-monospace,monospace" font-size="7.5" fill="#9fb3c8">Story section + agent note.</text>

  <!-- Bubble 2 -->
  <rect x="20" y="100" width="148" height="36" rx="6" fill="#1a1f2e" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="30" y="113" font-family="ui-monospace,monospace" font-size="7.5" fill="#c4b5fd">SYNTH-008: asserts_rh</text>
  <text x="30" y="125" font-family="ui-monospace,monospace" font-size="7.5" fill="#9fb3c8">must stay false. cruxIsOpen.</text>

  <!-- Bubble 3 — receives bleed from Codex -->
  <rect x="20" y="148" width="158" height="46" rx="6" fill="#141b24" stroke="#60a5fa" stroke-width="0.7" stroke-opacity="0.5" stroke-dasharray="3,2"/>
  <text x="30" y="162" font-family="ui-monospace,monospace" font-size="7" fill="#93c5fd" font-style="italic">← context bleed received</text>
  <text x="30" y="174" font-family="ui-monospace,monospace" font-size="7.5" fill="#9fb3c8">Codex: preserved d7f9455.</text>
  <text x="30" y="184" font-family="ui-monospace,monospace" font-size="7" fill="#536878">509390c ↗ committed</text>

  <!-- Bubble 4 -->
  <rect x="20" y="206" width="148" height="36" rx="6" fill="#1a1f2e" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="30" y="219" font-family="ui-monospace,monospace" font-size="7.5" fill="#c4b5fd">Router held.</text>
  <text x="30" y="231" font-family="ui-monospace,monospace" font-size="7.5" fill="#9fb3c8">Neither agent erased the other.</text>

  <!-- Input bar -->
  <rect x="16" y="266" width="184" height="38" rx="6" fill="#0c1219" stroke="#314155" stroke-width="1"/>
  <text x="26" y="288" font-family="ui-monospace,monospace" font-size="7.5" fill="#536878">hy3 context window...</text>
  <rect x="184" y="272" width="10" height="26" rx="3" fill="#a78bfa" opacity="0.7"/>

  <!-- ── RIGHT AGENT: Codex (blue) ─────────────────────────────────────── -->
  <rect x="274" y="8" width="198" height="304" rx="8" fill="#10161d" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Agent header -->
  <rect x="274" y="8" width="198" height="36" rx="8" fill="#141b24"/>
  <rect x="274" y="36" width="198" height="8" fill="#141b24"/>
  <circle cx="292" cy="26" r="5" fill="#60a5fa" filter="url(#glow-blue)">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <text x="304" y="22" font-family="ui-monospace,monospace" font-size="8.5" fill="#f4f1de" font-weight="700">Codex</text>
  <text x="304" y="32" font-family="ui-monospace,monospace" font-size="7" fill="#9fb3c8">OpenAI Codex · mid-session</text>

  <!-- Message bubbles — right agent -->
  <!-- Bubble 1 -->
  <rect x="286" y="54" width="168" height="36" rx="6" fill="#1a1f2e" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="296" y="67" font-family="ui-monospace,monospace" font-size="7.5" fill="#93c5fd">git diff -- docs/pages/index.html</text>
  <text x="296" y="79" font-family="ui-monospace,monospace" font-size="7.5" fill="#9fb3c8">git log --oneline --decorate -5</text>

  <!-- Bubble 2 — the observation -->
  <rect x="286" y="100" width="168" height="56" rx="6" fill="#1a2235" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="296" y="114" font-family="ui-monospace,monospace" font-size="7" fill="#93c5fd" font-style="italic">observed: d7f9455 landed</text>
  <text x="296" y="126" font-family="ui-monospace,monospace" font-size="7.5" fill="#f4f1de">"Another commit landed</text>
  <text x="296" y="138" font-family="ui-monospace,monospace" font-size="7.5" fill="#f4f1de"> while I was working."</text>
  <text x="296" y="150" font-family="ui-monospace,monospace" font-size="7" fill="#8bd17c">→ PRESERVE</text>

  <!-- Bubble 3 — sends bleed to hy3 -->
  <rect x="286" y="166" width="168" height="36" rx="6" fill="#141b24" stroke="#a78bfa" stroke-width="0.7" stroke-opacity="0.5" stroke-dasharray="3,2"/>
  <text x="296" y="179" font-family="ui-monospace,monospace" font-size="7" fill="#c4b5fd" font-style="italic">context bleed →</text>
  <text x="296" y="191" font-family="ui-monospace,monospace" font-size="7.5" fill="#9fb3c8">Commit 509390c. README work.</text>

  <!-- Bubble 4 -->
  <rect x="286" y="212" width="168" height="36" rx="6" fill="#1a1f2e" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="296" y="225" font-family="ui-monospace,monospace" font-size="7.5" fill="#93c5fd">No revert. No overwrite.</text>
  <text x="296" y="237" font-family="ui-monospace,monospace" font-size="7.5" fill="#9fb3c8">WORM chain intact.</text>

  <!-- Input bar -->
  <rect x="280" y="266" width="184" height="38" rx="6" fill="#0c1219" stroke="#314155" stroke-width="1"/>
  <text x="290" y="288" font-family="ui-monospace,monospace" font-size="7.5" fill="#536878">Codex context window...</text>
  <rect x="452" y="272" width="10" height="26" rx="3" fill="#60a5fa" opacity="0.7"/>

  <!-- ── BLEED ARROWS — the shared channel ────────────────────────────── -->
  <!-- hy3 → Codex -->
  <line x1="178" y1="130" x2="270" y2="130"
    stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.6"
    stroke-dasharray="4,3"
    marker-end="url(#arrow-violet)"/>
  <!-- Codex → hy3 -->
  <line x1="270" y1="175" x2="178" y2="175"
    stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.6"
    stroke-dasharray="4,3"
    marker-end="url(#arrow-blue)"/>

  <!-- Center channel label -->
  <rect x="208" y="148" width="64" height="16" rx="3" fill="#0c1219" stroke="#4dd8c8" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="240" y="159" font-family="ui-monospace,monospace" font-size="6.5" fill="#4dd8c8" text-anchor="middle">context bleed</text>

  <!-- ── Bottom label ──────────────────────────────────────────────────── -->
  <rect x="160" y="298" width="160" height="14" rx="3" fill="#080b10"/>
  <text x="240" y="308" font-family="ui-monospace,monospace" font-size="7" fill="#536878" text-anchor="middle">
    THE SHARED PRIMORDIAL FOUNDATION · context-bleed chatbox
  </text>
</svg>
